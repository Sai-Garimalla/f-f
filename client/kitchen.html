<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍳 Kitchen KOT — Fire & Flavour</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: #1a1a2e; }
  .kitchen-header { padding: 12px 16px; background: linear-gradient(135deg, #1a1a2e, #16213e); border-bottom: 2px solid #E65100; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .kitchen-header h2 { margin: 0; font-size: 18px; color: #FF8F00; }
  .kitchen-header p  { margin: 3px 0 0; font-size: 11px; color: #aaa; }
  .kitchen-clock { font-size: 22px; font-weight: 800; color: #fff; font-family: monospace; }
  .kitchen-date  { font-size: 11px; color: #aaa; text-align: right; }

  /* Status filter */
  .pack-tabs { display: flex; gap: 6px; padding: 10px 14px; background: #0f3460; overflow-x: auto; border-bottom: 1px solid #E65100; }
  .pack-tab { padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: 700; border: 1px solid #333; background: #16213e; color: #aaa; cursor: pointer; white-space: nowrap; transition: all .15s; }
  .pack-tab.active { background: linear-gradient(135deg, #E65100, #FF8F00); border-color: transparent; color: #fff; }

  /* Summary bar */
  .summary-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 14px; background: #0f3460; }
  .sum-box { background: #16213e; border-radius: 10px; padding: 10px; text-align: center; border: 1px solid #333; }
  .sum-num { font-size: 24px; font-weight: 800; color: #FF8F00; }
  .sum-lbl { font-size: 10px; color: #aaa; margin-top: 2px; text-transform: uppercase; }

  /* Order cards */
  .kot-list { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .kot-card { border-radius: 14px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.3); transition: transform .15s; }
  .kot-card:hover { transform: translateY(-2px); }
  .kot-card.pack-pending  { border: 2px solid #546E7A; }
  .kot-card.pack-packing  { border: 2px solid #FFB300; }
  .kot-card.pack-packed   { border: 2px solid #43A047; opacity: .85; }

  .kot-head { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .kot-head.pack-pending  { background: linear-gradient(135deg, #263238, #37474F); }
  .kot-head.pack-packing  { background: linear-gradient(135deg, #4a2c00, #6d4400); }
  .kot-head.pack-packed   { background: linear-gradient(135deg, #1a3a1a, #2E7D32); }

  .kot-token { font-size: 28px; font-weight: 900; color: #FF8F00; min-width: 60px; }
  .kot-info  { flex: 1; }
  .kot-name  { font-size: 15px; font-weight: 700; color: #fff; }
  .kot-phone { font-size: 13px; color: #FFB300; margin-top: 2px; }
  .kot-type  { font-size: 11px; color: #ccc; margin-top: 2px; }
  .kot-time  { font-size: 11px; color: #aaa; text-align: right; }
  .pack-badge { padding: 4px 12px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; white-space: nowrap; }
  .pb-pending { background: #546E7A; color: #fff; }
  .pb-packing { background: #FFB300; color: #000; }
  .pb-packed  { background: #43A047; color: #fff; }

  /* Items */
  .kot-items { background: #16213e; }
  .kot-item  { display: flex; align-items: center; padding: 10px 14px; border-bottom: 1px solid #1a2a4a; gap: 12px; }
  .kot-item:last-child { border-bottom: none; }
  .item-chk  { width: 24px; height: 24px; border-radius: 6px; border: 2px solid #546E7A; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; transition: all .15s; cursor: pointer; }
  .item-chk.checked { background: #43A047; border-color: #43A047; color: #fff; }
  .item-name { flex: 1; font-size: 14px; font-weight: 600; color: #fff; }
  .item-note-text { font-size: 10px; color: #FF8F00; margin-top: 2px; }
  .item-qty  { font-size: 20px; font-weight: 900; color: #FF8F00; min-width: 32px; text-align: right; }

  /* Note / address bar */
  .kot-note  { background: #0f3460; padding: 8px 14px; font-size: 12px; color: #FFB300; border-top: 1px solid #1a2a4a; }

  /* Action buttons */
  .kot-actions { display: flex; gap: 8px; padding: 12px 14px; background: #16213e; border-top: 1px solid #1a2a4a; }
  .btn-packing { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 13px; font-weight: 800; cursor: pointer; transition: all .15s; }
  .btn-start  { background: linear-gradient(135deg, #FFB300, #FF8F00); color: #000; }
  .btn-done   { background: linear-gradient(135deg, #2E7D32, #43A047); color: #fff; }
  .btn-done-disabled { background: #2E7D32; color: #fff; opacity: .6; cursor: not-allowed; }
  .btn-start:hover { filter: brightness(1.1); }
  .btn-done:hover  { filter: brightness(1.1); }

  .no-orders { text-align: center; padding: 80px 20px; color: #546E7A; }
  .no-orders .icon { font-size: 56px; margin-bottom: 14px; }
  .no-orders p { font-size: 15px; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content" style="padding:0; background:#1a1a2e;">

    <div class="kitchen-header">
      <div>
        <h2>🍳 Kitchen — KOT & Packing</h2>
        <p>Mark orders as Packing → Packed to notify delivery</p>
      </div>
      <div style="text-align:right;">
        <div class="kitchen-clock" id="kitchen-clock">--:--:--</div>
        <div class="kitchen-date" id="kitchen-date">Loading…</div>
      </div>
    </div>

    <div class="summary-bar">
      <div class="sum-box"><div class="sum-num" id="cnt-pending">0</div><div class="sum-lbl">⏳ Pending</div></div>
      <div class="sum-box"><div class="sum-num" id="cnt-packing">0</div><div class="sum-lbl">🔥 Packing</div></div>
      <div class="sum-box"><div class="sum-num" id="cnt-packed">0</div><div class="sum-lbl">✅ Packed</div></div>
    </div>

    <div class="pack-tabs">
      <button class="pack-tab active" data-filter="pending" onclick="filterKOT('pending', this)">⏳ Pending</button>
      <button class="pack-tab" data-filter="packing" onclick="filterKOT('packing', this)">🔥 Packing</button>
      <button class="pack-tab" data-filter="packed"  onclick="filterKOT('packed', this)">✅ Packed</button>
      <button class="pack-tab" data-filter="all"     onclick="filterKOT('all', this)">📋 All</button>
    </div>

    <div class="kot-list" id="kot-list">
      <div class="no-orders"><div class="icon">⏳</div><p>Loading orders…</p></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
if (!authGuard(['kitchen','admin','staff'])) throw 0;
initSidebar('kitchen');

let allOrders = [];
let currentFilter = 'pending';
let checkedItems = {}; // billId → Set of checked item indices

// Live clock
function updateClock() {
  const now = new Date();
  const ist = new Date(now.getTime() + 5.5 * 60 * 60 * 1000);
  document.getElementById('kitchen-clock').textContent = ist.toTimeString().slice(0, 8);
  document.getElementById('kitchen-date').textContent = ist.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Kolkata' });
}
updateClock();
setInterval(updateClock, 1000);

function tokenDisplay(order) {
  const pfx = order.token_prefix || 'T';
  return pfx === 'T' ? '#' + order.token_number : '#' + pfx + order.token_number;
}

async function loadOrders() {
  try {
    const date = new Date(Date.now() + 5.5 * 60 * 60 * 1000).toISOString().split('T')[0];
    const data = await apiFetch('/delivery/kitchen/orders?date=' + date);
    allOrders = data.orders || [];
    updateSummary();
    renderKOT();
  } catch (e) {
    document.getElementById('kot-list').innerHTML = `<div class="no-orders"><div class="icon">❌</div><p>${e.message}</p></div>`;
  }
}

function updateSummary() {
  document.getElementById('cnt-pending').textContent = allOrders.filter(o => o.packing_status === 'pending').length;
  document.getElementById('cnt-packing').textContent = allOrders.filter(o => o.packing_status === 'packing').length;
  document.getElementById('cnt-packed').textContent  = allOrders.filter(o => o.packing_status === 'packed').length;
}

function filterKOT(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.pack-tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderKOT();
}

async function renderKOT() {
  const list = document.getElementById('kot-list');
  let orders = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.packing_status === currentFilter);

  if (!orders.length) {
    const msgs = { pending: 'No pending orders! 🎉', packing: 'Nothing being packed right now.', packed: 'No packed orders yet.', all: 'No orders today yet.' };
    list.innerHTML = `<div class="no-orders"><div class="icon">${currentFilter === 'packed' ? '✅' : '🍳'}</div><p>${msgs[currentFilter] || ''}</p></div>`;
    return;
  }

  // For each order, fetch items if not cached
  const html = await Promise.all(orders.map(async order => {
    let items = order._items;
    if (!items) {
      try {
        const d = await apiFetch(`/delivery/kitchen/orders/${order.bill_id}`);
        items = d.items || [];
        order._items = items;
      } catch(e) { items = []; }
    }

    const bid = order.bill_id;
    if (!checkedItems[bid]) checkedItems[bid] = new Set();
    const checked = checkedItems[bid];
    const allChecked = items.length > 0 && items.every((_, i) => checked.has(i));

    const ot = (order.order_type || '').toLowerCase();
    const isDelivery = ot.includes('delivery');
    const isTakeaway = ot.includes('takeaway');
    const typeBadge = isDelivery ? '🛵 Delivery' : (isTakeaway ? '🥡 Takeaway' : '🪑 Dine-in');
    const ps = order.packing_status || 'pending';

    return `
      <div class="kot-card pack-${ps}" id="kot-${bid}">
        <div class="kot-head pack-${ps}">
          <div class="kot-token">${tokenDisplay(order)}</div>
          <div class="kot-info">
            <div class="kot-name">${order.customer_name || 'Walk-in'}</div>
            ${order.customer_phone ? `<div class="kot-phone">📞 ${order.customer_phone}</div>` : ''}
            <div class="kot-type">${typeBadge} · ${order.order_type || 'Dine-in'}</div>
          </div>
          <div>
            <span class="pack-badge pb-${ps}">${ps === 'pending' ? '⏳ Pending' : (ps === 'packing' ? '🔥 Packing' : '✅ Packed')}</span>
            <div class="kot-time" style="margin-top:6px">${formatDateTime(order.created_at)}</div>
          </div>
        </div>

        ${order.delivery_address ? `<div class="kot-note">📍 ${order.delivery_address}</div>` : ''}
        ${order.custom_note ? `<div class="kot-note" style="color:#FF8F00;">📝 ${order.custom_note}</div>` : ''}

        <div class="kot-items">
          ${items.map((item, i) => `
            <div class="kot-item" onclick="toggleItemCheck(${bid}, ${i})">
              <div class="item-chk ${checked.has(i) ? 'checked' : ''}" id="chk-${bid}-${i}">${checked.has(i) ? '✓' : ''}</div>
              <div class="item-name">
                ${item.item_name}
                ${item.item_note ? `<div class="item-note-text">↳ ${item.item_note}</div>` : ''}
              </div>
              <div class="item-qty">×${item.quantity}</div>
            </div>`).join('')}
        </div>

        <div class="kot-actions">
          ${ps === 'pending' ? `
            <button class="btn-packing btn-start" onclick="updatePacking(${bid}, 'packing')">🔥 Start Packing</button>
          ` : ''}
          ${ps === 'packing' ? `
            <button class="btn-packing btn-start" onclick="updatePacking(${bid}, 'pending')">↩ Revert</button>
            <button class="btn-packing ${allChecked ? 'btn-done' : 'btn-done-disabled'}" onclick="${allChecked ? 'updatePacking(' + bid + ', \'packed\')' : 'showToast(\'Tick all items before marking packed!\', \'warning\')'}"
              id="btn-pack-${bid}">✅ Mark Packed${!allChecked && items.length ? ' (' + checked.size + '/' + items.length + ')' : ''}</button>
          ` : ''}
          ${ps === 'packed' ? `
            <button class="btn-packing btn-start" style="background:linear-gradient(135deg,#546E7A,#78909C);color:#fff" onclick="updatePacking(${bid}, 'packing')">↩ Reopen</button>
            <div style="flex:1;display:flex;align-items:center;justify-content:center;color:#43A047;font-weight:800;font-size:13px">✅ Order Packed & Ready</div>
          ` : ''}
        </div>
      </div>`;
  }));

  list.innerHTML = html.join('');
}

function toggleItemCheck(billId, idx) {
  if (!checkedItems[billId]) checkedItems[billId] = new Set();
  const set = checkedItems[billId];
  if (set.has(idx)) set.delete(idx); else set.add(idx);
  const chkEl = document.getElementById(`chk-${billId}-${idx}`);
  if (chkEl) { chkEl.classList.toggle('checked', set.has(idx)); chkEl.textContent = set.has(idx) ? '✓' : ''; }

  // Update "Mark Packed" button
  const order = allOrders.find(o => o.bill_id === billId);
  const items = order?._items || [];
  const allChecked = items.length > 0 && items.every((_, i) => set.has(i));
  const btn = document.getElementById(`btn-pack-${billId}`);
  if (btn) {
    btn.className = `btn-packing ${allChecked ? 'btn-done' : 'btn-done-disabled'}`;
    btn.textContent = `✅ Mark Packed${!allChecked && items.length ? ' (' + set.size + '/' + items.length + ')' : ''}`;
    btn.onclick = allChecked ? () => updatePacking(billId, 'packed') : () => showToast('Tick all items first!', 'warning');
  }
}

async function updatePacking(billId, status) {
  try {
    await apiFetch(`/delivery/kitchen/orders/${billId}/packing`, {
      method: 'PATCH', body: JSON.stringify({ packing_status: status })
    });
    const order = allOrders.find(o => o.bill_id === billId);
    if (order) {
      order.packing_status = status;
      if (status === 'packed') order.delivery_status = 'ready';
    }
    const msgs = { pending: '↩ Reverted to Pending', packing: '🔥 Started Packing!', packed: '✅ Order Packed!' };
    showToast(msgs[status] || 'Updated', 'success');
    updateSummary();
    renderKOT();
  } catch (e) { showToast('❌ ' + e.message, 'error'); }
}

// Auto-refresh every 20 seconds
setInterval(() => { loadOrders(); }, 20000);
loadOrders();
</script>
</body>
</html>
