<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Search — Fire & Flavour</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .search-hero { background: linear-gradient(135deg,#E65100,#FF8F00); border-radius: 14px; padding: 24px; margin-bottom: 20px; color:#fff; text-align:center; }
  .search-hero h2 { font-size:20px; font-weight:800; }
  .search-hero p { font-size:13px; opacity:.9; margin-top:4px; }
  .phone-input-wrap { display:flex; gap:10px; max-width:480px; margin:16px auto 0; }
  .phone-input-wrap input { flex:1; padding:12px 16px; border-radius:10px; border:none; font-size:14px; background:#fff; color:#3E2000; }
  .phone-input-wrap button { padding:12px 20px; border-radius:10px; border:none; background:rgba(255,255,255,0.25); color:#fff; font-weight:700; cursor:pointer; font-size:14px; transition:.2s; }
  .phone-input-wrap button:hover { background:rgba(255,255,255,0.4); }
  .cust-profile { background:#fff; border:1px solid #FFCC80; border-radius:14px; padding:20px; margin-bottom:20px; }
  .cust-stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .cust-stat { background:linear-gradient(135deg,#FFF3E0,#FFE0B2); border-radius:10px; padding:14px; text-align:center; }
  .cust-stat .val { font-size:20px; font-weight:800; color:#E65100; }
  .cust-stat .lbl { font-size:11px; color:#8D6E63; margin-top:4px; }
  .order-card { border:1px solid #FFE0B2; border-radius:10px; padding:14px; margin-bottom:10px; background:#fff; display:flex; justify-content:space-between; align-items:center; }
  .order-card:hover { background:#FFF8F0; }
  .order-token { background:linear-gradient(135deg,#E65100,#FF8F00); color:#fff; border-radius:8px; padding:6px 12px; font-weight:800; font-size:16px; }
  @media(max-width:768px){ .cust-stat-grid{grid-template-columns:1fr 1fr;} .phone-input-wrap{flex-direction:column;} }
</style>
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="page-header">
      <div><h2>🔍 Customer Search</h2><p>Look up order history by mobile number</p></div>
    </div>
    <div class="page-body">
      <div class="search-hero">
        <h2>📞 Customer Lookup</h2>
        <p>Enter a mobile number to view full order history and analytics</p>
        <div class="phone-input-wrap">
          <input type="tel" id="phone-input" placeholder="Enter 10-digit mobile number" maxlength="10" oninput="this.value=this.value.replace(/\D/g,'')">
          <button onclick="doSearch()">🔍 Search</button>
        </div>
      </div>

      <div id="result-section" style="display:none">
        <div class="cust-profile" id="cust-profile"></div>
        <div class="card">
          <div class="card-header"><span class="card-title">📋 Order History</span></div>
          <div id="order-history-list" style="padding:12px"></div>
        </div>
      </div>

      <div id="empty-section" style="display:none; text-align:center; padding:60px 20px; color:#8D6E63;">
        <div style="font-size:48px">🔍</div>
        <p style="margin-top:12px; font-size:14px">No customer found with this number.</p>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
if (!authGuard()) throw 0;
initSidebar('customer-search');

document.getElementById('phone-input').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

async function doSearch() {
  const phone = document.getElementById('phone-input').value.trim();
  if (phone.length < 10) { showToast('Enter a valid 10-digit mobile number','warning'); return; }
  document.getElementById('result-section').style.display='none';
  document.getElementById('empty-section').style.display='none';

  try {
    const data = await apiFetch(`/bills/customer/${phone}`);
    if (!data.visit_count && data.visit_count !== 0) throw new Error('No data');

    if (data.visit_count === 0) {
      document.getElementById('empty-section').style.display='block';
      return;
    }

    const profile = document.getElementById('cust-profile');
    profile.innerHTML = `
      <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
        <div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#E65100,#FF8F00);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff;flex-shrink:0">
          ${data.customer_name ? data.customer_name[0].toUpperCase() : '?'}
        </div>
        <div>
          <div style="font-size:18px;font-weight:800;color:#3E2000">${data.customer_name || 'Unknown Customer'}</div>
          <div style="font-size:13px;color:#8D6E63;margin-top:2px">📞 ${phone}</div>
        </div>
      </div>
      <div class="cust-stat-grid">
        <div class="cust-stat"><div class="val">${data.visit_count}</div><div class="lbl">Total Orders</div></div>
        <div class="cust-stat"><div class="val">${formatCurrency(data.total_spent)}</div><div class="lbl">Total Spent</div></div>
        <div class="cust-stat"><div class="val">${data.visit_count > 0 ? formatCurrency(data.total_spent / data.visit_count) : '₹0'}</div><div class="lbl">Avg Order Value</div></div>
      </div>`;

    const histEl = document.getElementById('order-history-list');
    if (!data.history.length) {
      histEl.innerHTML = '<p style="color:#8D6E63;text-align:center;padding:20px">No orders found.</p>';
    } else {
      histEl.innerHTML = data.history.map(h => `
        <div class="order-card">
          <div style="display:flex;align-items:center;gap:12px;">
            <div class="order-token">#${h.token_number}</div>
            <div>
              <div style="font-size:13px;font-weight:700;color:#3E2000">${h.bill_number}</div>
              <div style="font-size:11px;color:#8D6E63">${h.order_type || 'Dine-in'} · ${formatDateTime(h.created_at)}</div>
            </div>
          </div>
          <div style="font-weight:800;font-size:16px;color:#E65100">${formatCurrency(h.grand_total)}</div>
        </div>`).join('');
    }
    document.getElementById('result-section').style.display='block';
  } catch(e) {
    if (e.message === 'No data') document.getElementById('empty-section').style.display='block';
    else showToast(e.message,'error');
  }
}
</script>
</body>
</html>
