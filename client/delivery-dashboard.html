<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛵 My Dashboard — Fire & Flavour</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .db-header { padding:16px; background:linear-gradient(135deg,#1a1a2e,#16213e); color:#fff; border-bottom:2px solid #E65100; }
  .db-header h2 { margin:0; font-size:20px; color:#FF8F00; }
  .db-header p  { margin:4px 0 0; font-size:12px; color:#aaa; }
  .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:14px; }
  .stat-card { background:#fff; border:1.5px solid #FFCC80; border-radius:14px; padding:16px; text-align:center; box-shadow:0 2px 8px rgba(230,81,0,.07); }
  .stat-num { font-size:32px; font-weight:900; color:#E65100; }
  .stat-lbl { font-size:11px; color:#8D6E63; font-weight:700; text-transform:uppercase; margin-top:4px; }
  .money-card { background:linear-gradient(135deg,#1a1a2e,#16213e); border:none; }
  .money-card .stat-num { color:#4CAF50; }
  .money-card .stat-lbl { color:#aaa; }
  .section-title { padding:0 14px 6px; font-size:12px; font-weight:800; color:#8D6E63; text-transform:uppercase; letter-spacing:.5px; }
  .collection-row { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:#fff; border-bottom:1px solid #FFE0B2; }
  .collection-row:last-child { border-bottom:none; }
  .col-label { font-size:13px; color:#3E2000; font-weight:600; }
  .col-value { font-size:16px; font-weight:800; color:#2E7D32; }
  .col-value.upi { color:#1565C0; }
  .recent-section { margin:14px; background:#fff; border:1.5px solid #FFCC80; border-radius:14px; overflow:hidden; }
  .recent-header { padding:10px 14px; background:linear-gradient(135deg,#FFF3E0,#FFE0B2); font-size:12px; font-weight:800; color:#E65100; border-bottom:1px solid #FFCC80; }
  .order-row { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid #FFE0B2; cursor:pointer; }
  .order-row:last-child { border-bottom:none; }
  .order-row:hover { background:#FFF8F0; }
  .ord-token { font-size:16px; font-weight:900; color:#E65100; }
  .ord-customer { font-size:12px; color:#3E2000; font-weight:600; }
  .ord-time { font-size:10px; color:#aaa; }
  .ord-total { font-size:14px; font-weight:800; color:#2E7D32; }
  .badge-sm { padding:2px 8px; border-radius:8px; font-size:9px; font-weight:700; }
  .badge-delivered { background:#E8F5E9; color:#2E7D32; }
  .badge-picked_up { background:#E3F2FD; color:#1565C0; }
  .badge-ready     { background:#E8F5E9; color:#43A047; }
  .badge-pending   { background:#ECEFF1; color:#546E7A; }
  .no-data { text-align:center; padding:40px; color:#BCAAA4; font-size:14px; }
  .refresh-btn { display:block; margin:0 14px 14px; padding:12px; background:linear-gradient(135deg,#E65100,#FF8F00); color:#fff; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; width:calc(100% - 28px); }
</style>
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content" style="padding:0;">
    <div class="db-header">
      <h2>🛵 My Dashboard</h2>
      <p id="db-greeting">Loading today's stats…</p>
    </div>

    <!-- Stats grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="stat-assigned">—</div>
        <div class="stat-lbl">📦 Assigned</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-delivered">—</div>
        <div class="stat-lbl">🏁 Delivered</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-pending">—</div>
        <div class="stat-lbl">⏳ Pending</div>
      </div>
      <div class="stat-card money-card">
        <div class="stat-num" id="stat-total">₹0</div>
        <div class="stat-lbl">💰 Total Collected</div>
      </div>
    </div>

    <!-- Payment breakdown -->
    <div class="section-title">💰 Today's Collection</div>
    <div style="margin:0 14px 14px; background:#fff; border:1.5px solid #FFCC80; border-radius:14px; overflow:hidden;">
      <div class="collection-row">
        <span class="col-label">💵 Cash Collected</span>
        <span class="col-value" id="stat-cash">₹0.00</span>
      </div>
      <div class="collection-row">
        <span class="col-label">📱 UPI Collected</span>
        <span class="col-value upi" id="stat-upi">₹0.00</span>
      </div>
    </div>

    <!-- Recent deliveries -->
    <div class="section-title">📋 Today's Orders</div>
    <div class="recent-section">
      <div class="recent-header">Tap an order to view delivery details</div>
      <div id="recent-list"><div class="no-data">⏳ Loading…</div></div>
    </div>

    <button class="refresh-btn" onclick="loadStats()">🔄 Refresh</button>
  </div>
</div>

<script src="js/api.js"></script>
<script>
if (!authGuard(['delivery_boy','admin','staff'])) throw 0;
const currentUser = getUser();
initSidebar('delivery-dashboard');

document.getElementById('db-greeting').textContent =
  `Hello ${currentUser ? currentUser.full_name : 'Driver'}! Here's your today's summary.`;

function fmt(n) { return '₹' + parseFloat(n||0).toFixed(2); }
function tokenStr(pfx, num) {
  const p = pfx === 'T' ? 'DIN' : (pfx || 'DIN');
  return '#' + p + String(num).padStart(3,'0');
}

async function loadStats() {
  try {
    const data = await apiFetch('/dashboard/delivery-stats');
    const s = data.stats || {};
    document.getElementById('stat-assigned').textContent  = s.total_assigned || 0;
    document.getElementById('stat-delivered').textContent = s.delivered || 0;
    document.getElementById('stat-pending').textContent   = s.pending || 0;
    document.getElementById('stat-total').textContent     = fmt(s.total_collected);
    document.getElementById('stat-cash').textContent      = fmt(s.cash_collected);
    document.getElementById('stat-upi').textContent       = fmt(s.upi_collected);

    const list = document.getElementById('recent-list');
    const orders = data.recent_deliveries || [];
    if (!orders.length) {
      list.innerHTML = '<div class="no-data">No deliveries assigned today yet.</div>';
      return;
    }
    list.innerHTML = orders.map(o => `
      <div class="order-row" onclick="window.location.href='delivery.html'">
        <div>
          <div class="ord-token">${tokenStr(o.token_prefix, o.token_number)}</div>
          <div class="ord-customer">${o.customer_name || 'Customer'} · ${o.customer_phone || '—'}</div>
          <div class="ord-time">${o.delivery_address || o.order_type || ''}</div>
        </div>
        <div style="text-align:right;">
          <div class="ord-total">${fmt(o.grand_total)}</div>
          <div style="margin-top:4px;"><span class="badge-sm badge-${o.delivery_status}">${o.delivery_status.replace('_',' ')}</span></div>
          ${o.delivery_status === 'delivered' ? `<div style="font-size:10px;color:#2E7D32;margin-top:2px;">💵${fmt(o.cash_collected)} 📱${fmt(o.upi_collected)}</div>` : ''}
        </div>
      </div>
    `).join('');
  } catch(e) {
    document.getElementById('recent-list').innerHTML = `<div class="no-data">❌ ${e.message}</div>`;
  }
}

loadStats();
setInterval(loadStats, 30000);
</script>
</body>
</html>
