<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Fire & Flavour</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .chart-bar-wrap { display: flex; align-items: flex-end; gap: 6px; height: 80px; margin-top: 10px; }
  .chart-bar { flex: 1; background: var(--gradient); border-radius: 4px 4px 0 0; min-height: 4px; transition: height .4s ease; position: relative; }
  .chart-bar:hover::after { content: attr(data-tip); position: absolute; bottom: 105%; left: 50%; transform: translateX(-50%); background: #000; color: #fff; font-size: 10px; padding: 3px 6px; border-radius: 4px; white-space: nowrap; }
  .recent-bill-row { display: grid; grid-template-columns: 60px 1fr 90px 110px; gap: 8px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .token-badge { background: var(--gradient); border-radius: 6px; text-align: center; padding: 4px 6px; font-weight: 800; font-size: 14px; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <div class="page-header">
      <div><h2>📊 Dashboard</h2><p id="greeting">Good morning! Here's your business overview.</p></div>
      <div style="font-size:12px;color:var(--text-muted)" id="current-time"></div>
    </div>
    <div class="page-body">
      <!-- Stat Cards -->
      <div class="grid-4" style="margin-bottom:20px" id="stat-cards">
        <div class="stat-card flame"><div class="stat-icon">💰</div><div class="stat-value" id="stat-sales">—</div><div class="stat-label">Today's Sales</div></div>
        <div class="stat-card red"><div class="stat-icon">🧾</div><div class="stat-value" id="stat-bills">—</div><div class="stat-label">Today's Bills</div></div>
        <div class="stat-card green"><div class="stat-icon">🍽️</div><div class="stat-value" id="stat-menu">—</div><div class="stat-label">Menu Items</div></div>
        <div class="stat-card blue"><div class="stat-icon">📈</div><div class="stat-value" id="stat-avg">—</div><div class="stat-label">Avg Bill Value</div></div>
      </div>
      <!-- Charts + Recent -->
      <div class="grid-2">
        <div class="card">
          <div class="card-header"><span class="card-title">📅 Last 7 Days Sales</span></div>
          <div id="weekly-chart" class="chart-bar-wrap"></div>
          <div id="weekly-labels" style="display:flex;gap:6px;margin-top:4px;font-size:9px;color:var(--text-muted)"></div>
        </div>
        <div class="card">
          <div class="card-header">
            <span class="card-title">🕐 Recent Bills</span>
            <a href="/billing.html" class="btn btn-primary btn-sm">+ New Bill</a>
          </div>
          <div id="recent-bills-list">
            <div class="loader-full"><div class="loader"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
if (!authGuard()) throw 0;
initSidebar('dashboard');

// Clock
function updateClock() {
  document.getElementById('current-time').textContent = new Date().toLocaleString('en-IN', { weekday:'long', day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
}
updateClock(); setInterval(updateClock, 1000);

// Greeting
const h = new Date().getHours();
document.getElementById('greeting').textContent = (h<12?'Good morning':h<17?'Good afternoon':'Good evening') + "! Here's your business overview.";

async function loadDashboard() {
  try {
    const d = await apiFetch('/dashboard/stats');
    document.getElementById('stat-sales').textContent = formatCurrency(d.today_sales);
    document.getElementById('stat-bills').textContent = d.today_bills;
    document.getElementById('stat-menu').textContent = d.menu_count;
    document.getElementById('stat-avg').textContent = d.today_bills > 0 ? formatCurrency(d.today_sales / d.today_bills) : '₹0';

    // Weekly chart
    const chartWrap = document.getElementById('weekly-chart');
    const labelWrap = document.getElementById('weekly-labels');
    const maxVal = Math.max(...d.weekly_data.map(x => parseFloat(x.total)), 1);
    chartWrap.innerHTML = ''; labelWrap.innerHTML = '';

    // Fill missing days
    const days = {};
    d.weekly_data.forEach(x => { days[x.date] = x; });
    for (let i = 6; i >= 0; i--) {
      const dt = new Date(); dt.setDate(dt.getDate() - i);
      const key = dt.toISOString().split('T')[0];
      const val = parseFloat(days[key]?.total || 0);
      const pct = Math.max((val / maxVal) * 100, 4);
      const bar = document.createElement('div');
      bar.className = 'chart-bar';
      bar.style.height = pct + '%';
      bar.setAttribute('data-tip', formatCurrency(val));
      chartWrap.appendChild(bar);
      const lbl = document.createElement('div');
      lbl.style.flex = '1'; lbl.style.textAlign = 'center';
      lbl.textContent = dt.toLocaleDateString('en-IN', { weekday: 'short' });
      labelWrap.appendChild(lbl);
    }

    // Recent bills
    const list = document.getElementById('recent-bills-list');
    if (!d.recent_bills.length) { list.innerHTML = '<div class="empty-state"><div class="empty-icon">🧾</div><p>No bills today</p></div>'; return; }
    list.innerHTML = d.recent_bills.map(b => `
      <div class="recent-bill-row">
        <div class="token-badge">#${b.token_number}</div>
        <div><div style="font-size:12px;font-weight:600">${b.bill_number}</div><div style="font-size:10px;color:var(--text-muted)">${b.customer_phone || 'Walk-in'}</div></div>
        <div style="font-weight:700;color:var(--flame-light)">${formatCurrency(b.grand_total)}</div>
        <div style="font-size:10px;color:var(--text-muted)">${formatDateTime(b.created_at)}</div>
      </div>`).join('');
  } catch(e) { showToast(e.message, 'error'); }
}
loadDashboard();
</script>
</body>
</html>
