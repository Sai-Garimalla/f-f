<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Bill — Fire & Flavour</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .page-body { padding: 14px 16px; }
  .billing-layout { height: calc(100vh - 105px); }
  /* Topbar */
  .billing-topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 16px; background:#FFF8F0; border-bottom:2px solid #FFCC80; flex-wrap:wrap; }
  .topbar-left { display:flex; align-items:center; gap:10px; }
  .topbar-title { font-size:16px; font-weight:700; color:#E65100; }
  .topbar-token { font-size:20px; font-weight:800; color:#FF8F00; min-width:30px; }
  .topbar-center { display:flex; align-items:center; }
  .topbar-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .topbar-phone { max-width:145px; padding:6px 10px; }
  .topbar-name  { max-width:145px; padding:6px 10px; }
  /* Order type pills */
  .ot-pills { display:flex; gap:4px; }
  .ot-pill { padding:5px 12px; border-radius:20px; font-size:11px; font-weight:700; border:1px solid #FFCC80; background:#fff; color:#8D6E63; cursor:pointer; transition:all .15s; white-space:nowrap; }
  .ot-pill:hover { border-color:#F57C00; color:#E65100; background:#FFF3E0; }
  .ot-pill.active { background:linear-gradient(135deg,#E65100,#FF8F00); border-color:transparent; color:#fff; }
  /* Quick add */
  .quick-add { padding:6px 14px; border-bottom:1px solid #FFE0B2; background:#FFFDE7; }
  .quick-add form { display:flex; gap:5px; }
  .qa-name { flex:2; }
  .qa-price { width:80px; }
  .qa-qty { width:50px; }
  .np-btn { padding:12px; font-size:18px; font-weight:700; border-radius:8px; border:1px solid #FFCC80; background:#fff; color:#3E2000; cursor:pointer; }
  .np-btn:active { background:#FF8F00; color:#fff; }
  @media(max-width:768px) {
    .billing-topbar { flex-direction:column; align-items:stretch; gap:10px; }
    .topbar-center { margin-top:0; justify-content:flex-start; overflow-x:auto; padding-bottom:4px; }
    .topbar-right { margin-top:0; justify-content:space-between; }
    .customer-bar { flex-direction:column; align-items:stretch; }
    .customer-bar input { max-width:100% !important; }
    .manual-row form { flex-wrap:wrap; }
    .manual-row input { flex:1 1 45%; }
    .manual-row button { flex:1 1 100%; }
    .bill-panel { padding-bottom:80px; /* space for FAB */ }
  }
  .customer-bar input { flex: 1; max-width: 220px; }
  .addon-toggles { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .addon-section { padding: 8px 14px; border-bottom: 1px solid #FFE0B2; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; background: #FFF8F0; }
  .addon-group { display: flex; gap: 8px; align-items: center; }
  .addon-label { font-size: 11px; font-weight: 600; color: #8D6E63; }
  .del-btn { padding: 3px 10px; font-size: 11px; background: #FFF3E0; border: 1px solid #FFCC80; border-radius: 5px; cursor: pointer; color: #3E2000; }
  .del-btn.active { background: #F57C00; border-color: #F57C00; color: #fff; }
  .custom-del { width: 60px; }
  .discount-opts { display: flex; gap: 6px; align-items: center; }
  .manual-row { padding: 6px 14px; border-bottom: 1px solid #FFE0B2; background: #FFFDE7; }
  .manual-row form { display: flex; gap: 6px; }
  .manual-row input { flex: 1; padding: 5px 8px; }
  .bill-header { padding: 8px 14px; border-bottom: 1px solid #FFE0B2; display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; color: #8D6E63; letter-spacing:.5px; text-transform:uppercase; }
  .empty-bill { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #BCAAA4; gap: 8px; }
  .empty-bill .big-icon { font-size: 40px; }

  /* ── Cart Item Row ── */
  .cart-item {
    display: flex; flex-direction: column;
    padding: 10px 14px; border-bottom: 1px solid #FFE0B2;
    gap: 7px; transition: background .15s;
  }
  .cart-item:hover { background: #FFFDE7; }
  .cart-item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-name { font-size: 13px; font-weight: 600; color: #3E2000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
  .cart-item-code { font-size: 10px; color: #8D6E63; margin-top: 2px; }
  .cart-item-total { font-size: 14px; font-weight: 700; color: #E65100; white-space: nowrap; padding-top: 1px; }
  .cart-item-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cart-qty-ctrl { display: flex; align-items: center; background: #FFF3E0; border: 1px solid #FFCC80; border-radius: 8px; overflow: hidden; }
  .cart-qty-btn { width: 32px; height: 30px; border: none; background: none; color: #3E2000; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
  .cart-qty-btn:hover { background: #FFCC80; color: #E65100; }
  .cart-qty-val { min-width: 32px; text-align: center; font-size: 13px; font-weight: 700; border-left: 1px solid #FFCC80; border-right: 1px solid #FFCC80; padding: 0 4px; line-height: 30px; color: #3E2000; }
  .cart-price-input { width: 72px; height: 30px; background: #FFFDE7; border: 1px solid #FFCC80; border-radius: 7px; padding: 0 8px; color: #3E2000; font-size: 12px; text-align: right; font-family: inherit; }
  .cart-price-input:focus { outline: none; border-color: #F57C00; }
  .cart-price-label { font-size: 10px; color: #8D6E63; }
  .cart-remove-btn { width: 28px; height: 28px; border-radius: 7px; border: 1px solid rgba(198,40,40,0.25); background: rgba(198,40,40,0.07); color: #C62828; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .cart-remove-btn:hover { background: rgba(198,40,40,0.18); border-color: #C62828; }
  .cart-unit-price { font-size: 11px; color: #8D6E63; }
  /* Preview tabs */
  .prev-tabs { display:flex; border-bottom:2px solid #FFCC80; background:#FFF8F0; }
  .prev-tab { flex:1; padding:10px 6px; font-size:12px; font-weight:700; border:none; background:none; color:#8D6E63; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .15s; }
  .prev-tab.active { color:#E65100; border-bottom-color:#E65100; background:#fff; }
  .prev-content { display:none; }
  .prev-content.active { display:block; }

</head>
<body>
<div class="app-shell">
  <div class="sidebar" id="sidebar"></div>
  <div class="main-content">
    <!-- EZO-style top bar -->
    <div class="billing-topbar">
      <div class="topbar-left">
        <span class="topbar-title">🧾 New Bill</span>
        <span class="topbar-token" id="token-display">—</span>
      </div>
      <div class="topbar-center">
        <div class="ot-pills" id="order-type-pills">
          <button class="ot-pill active" data-type="Dine-in">🍽 Dine-in</button>
          <button class="ot-pill" data-type="Takeaway">🛍 Takeaway</button>
          <button class="ot-pill" data-type="Delivery">🛵 Delivery</button>
        </div>
        <input type="hidden" id="order-type" value="Dine-in">
      </div>
      <div class="topbar-right">
        <div id="order-meta-wrap" style="display:flex;gap:8px;">
          <input type="text" id="order-table" class="form-control" placeholder="Table No" style="max-width:80px;padding:6px 10px;">
          <select id="order-location" class="form-control" style="display:none; max-width:110px; padding:6px 10px;" onchange="toggleLocationOther()">
            <option value="">Location</option>
            <option value="Leaders">Leaders</option>
            <option value="B3">B3</option>
            <option value="Queens">Queens</option>
            <option value="VVH">VVH</option>
            <option value="Kings">Kings</option>
            <option value="Prince">Prince</option>
            <option value="IGH">IGH</option>
            <option value="Other">Other</option>
          </select>
          <input type="text" id="order-location-other" class="form-control" placeholder="Specify" style="display:none; max-width:90px; padding:6px 10px;">
        </div>
        <div style="display:flex; gap:6px; flex:1;">
          <input type="tel" id="customer-phone" class="topbar-phone form-control" placeholder="📞 Phone" oninput="handlePhoneInput(this.value)">
          <input type="text" id="customer-name" class="topbar-name form-control" placeholder="👤 Customer Name">
          <button id="cust-history-btn" class="btn btn-secondary btn-sm" style="display:none; padding: 0 10px;" onclick="showCustomerHistory()" title="View History">📜</button>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="holdBill()">⏸ Hold</button>
        <button class="btn btn-secondary btn-sm" onclick="clearBill()">🗑 Clear</button>
      </div>
    </div>

    <div class="billing-layout">
      <!-- Mobile Tab Bar -->
      <div class="mob-tabs">
        <button class="mob-tab-btn active" id="tab-menu-btn" onclick="switchTab('menu')">🍽 Menu</button>
        <button class="mob-tab-btn" id="tab-order-btn" onclick="switchTab('order')">🛒 Order <span id="tab-count"></span></button>
      </div>

      <!-- LEFT: Menu Search -->
      <div class="search-panel mob-panel active" id="panel-menu">
        <div class="search-header">
          <div style="display:flex;gap:8px;">
            <div class="search-input-wrap" style="flex:1">
              <span class="search-icon">🔍</span>
              <input type="text" class="form-control" id="menu-search" placeholder="Search items or code…" autocomplete="off">
            </div>
            <button class="btn btn-secondary" onclick="toggleNumpad()" title="Touch Numpad">🔢</button>
          </div>
        </div>
        <div id="touch-numpad" style="display:none; padding:10px; background:var(--surface2); border-bottom:1px solid var(--border);">
          <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px;">
            <button class="np-btn" onclick="npType(1)">1</button>
            <button class="np-btn" onclick="npType(2)">2</button>
            <button class="np-btn" onclick="npType(3)">3</button>
            <button class="np-btn" onclick="npType(4)">4</button>
            <button class="np-btn" onclick="npType(5)">5</button>
            <button class="np-btn" onclick="npType(6)">6</button>
            <button class="np-btn" onclick="npType(7)">7</button>
            <button class="np-btn" onclick="npType(8)">8</button>
            <button class="np-btn" onclick="npType(9)">9</button>
            <button class="np-btn" onclick="npType('C')">C</button>
            <button class="np-btn" onclick="npType(0)">0</button>
            <button class="np-btn" onclick="npAdd()" style="background:var(--flame);color:white;border:none;">Add</button>
          </div>
        </div>
        <div class="category-tabs" id="category-tabs">
          <button class="cat-tab active" data-cat="">All</button>
        </div>
        <div class="menu-grid" id="menu-grid">
          <div style="grid-column:span 2;padding:40px;text-align:center"><div class="loader"></div></div>
        </div>
      </div>

      <!-- RIGHT: Order Panel -->
      <div class="bill-panel mob-panel" id="panel-order">

        <!-- Quick Add -->
        <div class="quick-add">
          <form id="manual-form">
            <input type="text" class="form-control qa-name" id="manual-name" placeholder="Custom item name…">
            <input type="number" class="form-control qa-price" id="manual-price" placeholder="₹ Price" min="0" step="0.01">
            <input type="number" class="form-control qa-qty" id="manual-qty" value="1" min="1">
            <button type="submit" class="btn btn-secondary btn-sm">＋ Add</button>
          </form>
        </div>

        <!-- Delivery & Discount -->
        <div class="addon-section">
          <div class="addon-group">
            <label class="addon-label">🚗 Delivery</label>
            <label class="toggle"><input type="checkbox" id="delivery-toggle"><span class="toggle-slider"></span></label>
            <div id="delivery-opts" style="display:none;display:flex;gap:4px">
              <button class="del-btn" data-val="5">₹5</button>
              <button class="del-btn" data-val="10">₹10</button>
              <button class="del-btn" data-val="15">₹15</button>
              <button class="del-btn" data-val="20">₹20</button>
              <input type="number" class="form-control custom-del" id="custom-delivery" placeholder="Custom" min="0">
            </div>
          </div>
          <div class="addon-group">
            <label class="addon-label">🏷 Discount</label>
            <label class="toggle"><input type="checkbox" id="discount-toggle"><span class="toggle-slider"></span></label>
            <div id="discount-opts" style="display:none;display:flex;gap:6px;align-items:center">
              <select class="form-control" id="discount-type" style="width:70px;padding:4px 6px">
                <option value="percentage">%</option>
                <option value="fixed">₹</option>
              </select>
              <input type="number" class="form-control" id="discount-val" placeholder="0" min="0" step="0.01" style="width:70px">
            </div>
          </div>
        </div>

        <!-- Items List -->
        <div class="bill-items-list" id="bill-items-list">
          <div class="empty-bill">
            <div class="big-icon">🛒</div>
            <p>Add items from the menu</p>
          </div>
        </div>

        <!-- Totals -->
        <div class="totals-panel">
          <div class="total-row"><span>Subtotal</span><span id="t-subtotal">₹0.00</span></div>
          <div class="total-row" id="delivery-row" style="display:none"><span>Delivery</span><span id="t-delivery">₹0.00</span></div>
          <div class="total-row" id="discount-row" style="display:none"><span>Discount</span><span id="t-discount" style="color:#EF9A9A">-₹0.00</span></div>
          <div class="total-row grand"><span>GRAND TOTAL</span><span id="t-grand">₹0.00</span></div>
        </div>

        <!-- Actions -->
        <div class="bill-actions">
          <button class="btn btn-primary btn-lg" style="flex:1" id="print-btn" onclick="showPrintPreview()">🖨 Save &amp; Print</button>
          <button class="btn btn-success" style="flex:1" id="save-btn" onclick="saveBillOnly()">💾 Save Only</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Print Preview Modal (tabbed: Receipt / KOT / Checklist + editable cart) -->
<div class="modal-overlay" id="preview-modal">
  <div class="modal" style="max-width:620px">
    <div class="modal-header">
      <span class="modal-title">🖨️ Review &amp; Edit Before Printing</span>
      <button class="modal-close" onclick="closePreviewModal()">✕</button>
    </div>
    <div class="modal-body" style="padding:0">
      <div class="prev-tabs">
        <button class="prev-tab active" onclick="switchPreviewTab('receipt',this)">🧾 Receipt</button>
        <button class="prev-tab" onclick="switchPreviewTab('kot',this)">🍳 KOT</button>
        <button class="prev-tab" onclick="switchPreviewTab('checklist',this)">✅ Checklist</button>
      </div>
      <div class="prev-content active" id="prev-receipt" style="padding:12px">
        <pre id="preview-receipt-pre" style="font-family:monospace;font-size:12px;background:#FFFDE7;border:1px solid #FFCC80;padding:14px;border-radius:8px;overflow-x:auto;color:#3E2000;white-space:pre;line-height:1.5"></pre>
      </div>
      <div class="prev-content" id="prev-kot" style="padding:12px">
        <pre id="preview-kot-pre" style="font-family:monospace;font-size:12px;background:#FFFDE7;border:1px solid #FFCC80;padding:14px;border-radius:8px;overflow-x:auto;color:#3E2000;white-space:pre;line-height:1.5"></pre>
      </div>
      <div class="prev-content" id="prev-checklist" style="padding:12px">
        <pre id="preview-checklist-pre" style="font-family:monospace;font-size:12px;background:#FFFDE7;border:1px solid #FFCC80;padding:14px;border-radius:8px;overflow-x:auto;color:#3E2000;white-space:pre;line-height:1.5"></pre>
      </div>
      <div style="padding:12px;border-top:2px solid #FFCC80;background:#FFF8F0">
        <div style="font-size:11px;font-weight:700;color:#8D6E63;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">✏️ Edit Items (changes reflect in all 3 receipts)</div>
        <div id="preview-edit-list"></div>
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
          <input type="text" id="preview-add-name" class="form-control" placeholder="Item name" style="flex:2;min-width:110px;height:34px">
          <input type="number" id="preview-add-price" class="form-control" placeholder="₹" style="width:80px;height:34px">
          <input type="number" id="preview-add-qty" class="form-control" value="1" style="width:54px;height:34px">
          <button class="btn btn-secondary btn-sm" onclick="previewAddItem()">＋</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closePreviewModal()">Cancel</button>
      <button class="btn btn-primary" id="confirm-print-btn" onclick="confirmSaveAndPrint()">✅ Confirm &amp; Print</button>
    </div>
  </div>
</div>

<!-- Bill Success Modal -->
<div class="modal-overlay" id="success-modal">
  <div class="modal" style="max-width:360px;text-align:center">
    <div class="modal-body" style="padding:28px 20px">
      <div style="font-size:48px">✅</div>
      <h3 style="margin:10px 0 6px;font-size:18px;color:#E65100">Bill Saved!</h3>
      <div class="token-badge" style="display:inline-flex;font-size:24px;padding:8px 20px;margin:8px 0" id="success-token">—</div>
      <div style="font-size:13px;color:#8D6E63" id="success-billno"></div>
      <div style="font-size:20px;font-weight:800;color:#E65100;margin:8px 0" id="success-total"></div>
      <div id="print-status" style="margin-bottom:12px"></div>
      <div style="display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap">
        <button class="btn btn-secondary btn-sm" onclick="reprintDocument('receipt')">🧾 Receipt</button>
        <button class="btn btn-secondary btn-sm" onclick="reprintDocument('kot')">🍳 KOT</button>
        <button class="btn btn-secondary btn-sm" onclick="reprintDocument('checklist')">✅ Checklist</button>
      </div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="btn btn-secondary" onclick="closeSuccessModal()">New Bill</button>
        <a href="/recent-bills.html" class="btn btn-primary">View Bills</a>
      </div>
    </div>
  </div>
</div>

<!-- Customer History Modal -->
<div class="modal-overlay" id="cust-history-modal">
  <div class="modal" style="max-width:500px">
    <div class="modal-header">
      <span class="modal-title">📜 Customer History</span>
      <button class="modal-close" onclick="document.getElementById('cust-history-modal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body" style="padding:16px;">
      <div id="cust-history-content"></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
if (!authGuard()) throw 0;
initSidebar('billing');

// Order type pills
document.querySelectorAll('.ot-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    document.querySelectorAll('.ot-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    const type = pill.dataset.type;
    document.getElementById('order-type').value = type;
    
    // Toggle Table / Location inputs
    const tbTable = document.getElementById('order-table');
    const tbLoc = document.getElementById('order-location');
    const tbLocOther = document.getElementById('order-location-other');
    tbTable.style.display = type === 'Dine-in' ? 'block' : 'none';
    tbLoc.style.display = type === 'Delivery' ? 'block' : 'none';
    if (type !== 'Delivery') tbLocOther.style.display = 'none';
    else toggleLocationOther();

    // Show delivery option automatically if Delivery selected
    if (type === 'Delivery') {
      document.getElementById('delivery-toggle').checked = true;
      deliveryEnabled = true;
      document.getElementById('delivery-opts').style.display = 'flex';
      updateTotals();
    }
  });
});

function toggleLocationOther() {
  const val = document.getElementById('order-location').value;
  document.getElementById('order-location-other').style.display = val === 'Other' ? 'block' : 'none';
}

let billItems = [];
let menuItems = [];
let activeCategory = '';
let deliveryCharge = 0;
let deliveryEnabled = false;
let discountEnabled = false;
let printIntent = false;
let currentBillId = null;

// ── Mobile tab switching ──
function switchTab(tab) {
  const isMenu = tab === 'menu';
  document.getElementById('panel-menu').classList.toggle('active', isMenu);
  document.getElementById('panel-order').classList.toggle('active', !isMenu);
  document.getElementById('tab-menu-btn').classList.toggle('active', isMenu);
  document.getElementById('tab-order-btn').classList.toggle('active', !isMenu);
  updateTotals(); // re-eval FAB visibility
}

// ── Inject floating cart FAB (mobile only) ──
(function() {
  const fab = document.createElement('button');
  fab.id = 'cart-fab';
  fab.className = 'cart-fab';
  fab.innerHTML = `<span>\ud83d\udedd View Order</span><span class="cart-fab-count" id="fab-count"></span>`;
  fab.onclick = () => switchTab('order');
  document.body.appendChild(fab);
})();

// Load menu
async function loadMenu() {
  try {
    menuItems = await apiFetch('/menu');
    const cats = [...new Set(menuItems.map(i => i.category).filter(Boolean))].sort();
    const tabsEl = document.getElementById('category-tabs');
    cats.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'cat-tab'; btn.dataset.cat = c; btn.textContent = c;
      btn.addEventListener('click', () => { activeCategory = c; document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active')); btn.classList.add('active'); renderMenuGrid(); });
      tabsEl.appendChild(btn);
    });
    tabsEl.querySelector('[data-cat=""]').addEventListener('click', () => { activeCategory = ''; document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active')); tabsEl.querySelector('[data-cat=""]').classList.add('active'); renderMenuGrid(); });
    renderMenuGrid();
  } catch(e) { showToast('Failed to load menu: ' + e.message, 'error'); }
}

function renderMenuGrid(search='') {
  const grid = document.getElementById('menu-grid');
  let filtered = menuItems;
  if (activeCategory) filtered = filtered.filter(i => i.category === activeCategory);
  if (search) filtered = filtered.filter(i => i.item_name.toLowerCase().includes(search.toLowerCase()) || i.item_code.toLowerCase().includes(search.toLowerCase()));
  if (!filtered.length) { grid.innerHTML = '<div style="grid-column:span 2;padding:30px;text-align:center;color:var(--text-muted)">No items found</div>'; return; }
  grid.innerHTML = filtered.map(item => {
    const existing = billItems.find(b => b.item_code === item.item_code && !b.is_manual);
    const qty = existing ? existing.quantity : 0;
    
    let btnHTML = '';
    if (qty > 0) {
      btnHTML = `
        <div class="menu-qty-ctrl" onclick="event.stopPropagation()">
          <button class="menu-qty-btn" onclick="updateMenuItemQty('${item.item_code}', -1)">-</button>
          <div class="menu-qty-val">${qty}</div>
          <button class="menu-qty-btn" onclick="updateMenuItemQty('${item.item_code}', 1)">+</button>
        </div>
      `;
    } else {
      btnHTML = `<button class="menu-add-btn" onclick="event.stopPropagation(); updateMenuItemQty('${item.item_code}', 1)">+ Add</button>`;
    }

    return `
    <div class="menu-item-card ${qty > 0 ? 'active' : ''}" onclick="updateMenuItemQty('${item.item_code}', 1)">
      <div class="item-cat">${item.category}</div>
      <div class="item-name">${item.item_name}</div>
      <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:8px;">
        <div class="item-price">${formatCurrency(item.default_price)}</div>
        ${btnHTML}
      </div>
    </div>`;
  }).join('');
}

function updateMenuItemQty(itemCode, delta) {
  const item = menuItems.find(i => String(i.item_code) === String(itemCode));
  if (!item) return;
  const existingIdx = billItems.findIndex(b => b.item_code === item.item_code && !b.is_manual);
  
  if (existingIdx > -1) {
    const newQty = billItems[existingIdx].quantity + delta;
    if (newQty <= 0) {
      billItems.splice(existingIdx, 1);
    } else {
      billItems[existingIdx].quantity = newQty;
      billItems[existingIdx].line_total = newQty * billItems[existingIdx].unit_price;
    }
  } else if (delta > 0) {
    billItems.push({
      item_code: item.item_code,
      item_name: item.item_name,
      quantity: delta,
      unit_price: parseFloat(item.default_price),
      line_total: parseFloat(item.default_price) * delta,
      is_manual: false
    });
  }
  
  renderBill(); // This updates the cart side
  renderMenuGrid(); // This updates the + / - buttons on the menu grid side
}

function addItem(id) {

function changeQty(i, delta) {

  renderBill();
}

function changePrice(i, val) {

function removeItem(i) { billItems.splice(i, 1); renderBill(); }

function updateTotals() {
  const subtotal = billItems.reduce((s, i) => s + i.line_total, 0);
  const delivery = deliveryEnabled ? deliveryCharge : 0;
  let discountAmt = 0;
  if (discountEnabled) {
    const type = document.getElementById('discount-type').value;
    const val = parseFloat(document.getElementById('discount-val').value) || 0;
    discountAmt = type === 'percentage' ? (subtotal + delivery) * val / 100 : val;
  }
  const grand = Math.max(0, subtotal + delivery - discountAmt);
  document.getElementById('t-subtotal').textContent = formatCurrency(subtotal);
  document.getElementById('t-delivery').textContent = formatCurrency(delivery);
  document.getElementById('t-discount').textContent = '-' + formatCurrency(discountAmt);
  document.getElementById('t-grand').textContent = formatCurrency(grand);
  
  // Also keep the menu grid synced (e.g. if an item is removed from the cart)
  renderMenuGrid();
  document.getElementById('delivery-row').style.display = deliveryEnabled ? '' : 'none';
  document.getElementById('discount-row').style.display = discountEnabled ? '' : 'none';
  // Mobile FAB + tab badge
  const isMenu = document.getElementById('panel-menu').classList.contains('active');
  const n = billItems.reduce((s,i) => s+i.quantity, 0);
  const fab = document.getElementById('cart-fab');
  const tabCount = document.getElementById('tab-count');
  const fabCount = document.getElementById('fab-count');
  if (fab) { 
    fab.classList.toggle('has-items', n > 0 && isMenu); 
    if (fabCount) fabCount.textContent = n > 0 ? `${n} · ${formatCurrency(grand)}` : ''; 
  }
  if (tabCount) tabCount.textContent = n > 0 ? `(${n})` : '';
}

// ── Hold Bill ──
async function holdBill() {
  if (!billItems.length) { showToast('No items to hold.', 'warning'); return; }
  
  // Reserve token
  const btn = event.target;
  btn.disabled = true; btn.textContent = '⏳';
  let reservedToken = null;
  try {
    const res = await apiFetch('/billing/next-token');
    reservedToken = res.token_number;
  } catch(e) {
    showToast('Failed to reserve token', 'error');
    btn.disabled = false; btn.textContent = '⏸ Hold';
    return;
  }

  const drafts = JSON.parse(localStorage.getItem('ff_draft_bills') || '[]');
  const phone = document.getElementById('customer-phone').value.trim();
  const table = document.getElementById('order-table').value.trim();
  let draftName = `Token #${reservedToken}`;
  if (phone) draftName += ` | Ph: ${phone}`;
  else if (table) draftName += ` | Tb: ${table}`;

  drafts.push({
    id: Date.now(),
    name: draftName,
    token_number: reservedToken,
    items: billItems,
    customer_phone: phone,
    order_type: document.getElementById('order-type').value,
    table: table,
    location: document.getElementById('order-location').value,
    delivery: deliveryEnabled, discount: discountEnabled,
    date: new Date().toLocaleString()
  });
  localStorage.setItem('ff_draft_bills', JSON.stringify(drafts));
  showToast(`Held mapped to Token #${reservedToken}`, 'success');
  
  // Hacky way to let user restore drafts
  if (!document.getElementById('drafts-btn')) {
    const dBtn = document.createElement('button');
    dBtn.id = 'drafts-btn'; dBtn.className = 'btn btn-secondary btn-sm';
    dBtn.textContent = '📥 Drafts';
    dBtn.onclick = showDrafts;
    document.querySelector('.topbar-left').appendChild(dBtn);
  }
  billItems = []; // clear current
  clearBill();
  btn.disabled = false; btn.textContent = '⏸ Hold';
}

function showDrafts() {
  const drafts = JSON.parse(localStorage.getItem('ff_draft_bills') || '[]');
  if (!drafts.length) { showToast('No held bills', 'info'); return; }
  const pick = confirm(`You have ${drafts.length} held bill(s).\nRestore the most recent one? (${drafts[drafts.length-1].name})`);
  if (pick) {
    const d = drafts.pop();
    localStorage.setItem('ff_draft_bills', JSON.stringify(drafts));
    billItems = d.items;
    document.getElementById('customer-phone').value = d.customer_phone || '';
    document.getElementById('order-table').value = d.table || '';
    document.getElementById('order-location').value = d.location || '';
    const typePill = document.querySelector(`.ot-pill[data-type="${d.order_type}"]`);
    if (typePill) typePill.click(); // This simulates the click to restore table/loc inputs
    // Set token for saving
    window.reservedToken = d.token_number;
    document.getElementById('token-display').textContent = '#' + d.token_number;
    renderBill();
    showToast('Draft restored', 'success');
  }
}

// ── Build all 3 previews in the modal ──
function buildPreviews() {
  const pad  = (s, l) => String(s).padEnd(l).slice(0, l);

  const LINE = '-'.repeat(48);
  const DLINE = '='.repeat(48);

  const subtotal = billItems.reduce((s, i) => s + i.line_total, 0);
  const delivery = deliveryEnabled ? deliveryCharge : 0;
  const discType = document.getElementById('discount-type').value;
  const discVal  = parseFloat(document.getElementById('discount-val').value) || 0;
  const discAmt  = discountEnabled ? (discType === 'percentage' ? (subtotal+delivery)*discVal/100 : discVal) : 0;
  const grand    = Math.max(0, subtotal + delivery - discAmt);
  const now      = new Date();
  const dateStr  = now.toLocaleDateString('en-IN');
  const timeStr  = now.toLocaleTimeString('en-IN');
  const orderType = document.getElementById('order-type').value;
  const custName  = (document.getElementById('customer-name').value || '').trim();
  const custPhone = (document.getElementById('customer-phone').value || '').trim();

  let orderMeta = '';
  if (orderType === 'Dine-in') {
    const t = document.getElementById('order-table').value.trim();
    if (t) orderMeta = 'Table: ' + t;
  } else if (orderType === 'Delivery') {
    let loc = document.getElementById('order-location').value;
    if (loc === 'Other') loc = document.getElementById('order-location-other').value.trim();
    if (loc) orderMeta = 'Loc: ' + loc;
  }
  const fullType = orderType + (orderMeta ? ' | ' + orderMeta : '');

  // Generate preview bill number (date-token format, matches server)
  const previewDate = now.toISOString().slice(0,10).replace(/-/g,'');
  const previewBillNo = previewDate + '-[TOKEN]'; // token assigned by server on save

  // Delivery address (for Delivery orders)
  let deliveryAddr = '';
  if (orderType === 'Delivery') {
    deliveryAddr = document.getElementById('order-location').value;
    if (deliveryAddr === 'Other') deliveryAddr = (document.getElementById('order-location-other').value || '').trim();
  }

  // ── RECEIPT preview ──
  let r = '        Fire & Flavour\n';
  r += LINE + '\n';
  r += '          CUSTOMER RECEIPT\n';
  r += LINE + '\n';
  r += 'Bill No  : ' + previewBillNo + '\n';
  r += 'Date     : ' + dateStr + '\n';
  r += 'Time     : ' + timeStr + '\n';
  r += 'Type     : ' + fullType + '\n';
  if (custName)    r += 'Customer : ' + custName + '\n';
  if (custPhone)   r += 'Phone    : ' + custPhone + '\n';
  if (deliveryAddr) r += 'Address  : ' + deliveryAddr + '\n';
  r += LINE + '\n';
  r += pad('ITEM',24) + padL('QTY',4) + padL('PRICE',9) + padL('AMT',11) + '\n';
  r += LINE + '\n';
  for (const item of billItems) {
    r += pad(item.item_name,24) + padL(item.quantity,4) + padL(item.unit_price.toFixed(2),9) + padL(item.line_total.toFixed(2),11) + '\n';
  }
  r += LINE + '\n';
  r += pad('Subtotal',36) + padL(subtotal.toFixed(2),12) + '\n';
  if (deliveryEnabled) r += pad('Delivery Charge',36) + padL(delivery.toFixed(2),12) + '\n';
  if (discountEnabled && discAmt > 0) r += pad('Discount',36) + padL('-'+discAmt.toFixed(2),12) + '\n';
  r += LINE + '\n';
  r += pad('GRAND TOTAL',36) + padL(grand.toFixed(2),12) + '\n';
  r += LINE + '\n';
  r += '       Thank you! Visit again.\n';
  document.getElementById('preview-receipt-pre').textContent = r;

  // ── KOT preview ──
  let k = '        Fire & Flavour\n';
  k += '     *** KITCHEN ORDER ***\n';
  k += DLINE + '\n';
  k += '           TOKEN\n';
  k += '         [Assigned on Save]\n';
  k += DLINE + '\n';
  k += ('Date: ' + dateStr).padEnd(24).slice(0,24) + ('Time: ' + timeStr).padEnd(24).slice(0,24) + '\n';
  k += 'Bill     : ' + previewBillNo + '\n';
  k += 'Type     : ' + fullType + '\n';
  if (custName)    k += 'Name     : ' + custName + '\n';
  if (custPhone)   k += 'Ph       : ' + custPhone + '\n';
  if (deliveryAddr) k += 'Addr     : ' + deliveryAddr + '\n';
  k += DLINE + '\n';
  k += 'ITEM'.padEnd(41) + 'QTY'.padStart(7) + '\n';
  k += DLINE + '\n';
  for (const item of billItems) {
    k += item.item_name.padEnd(41).slice(0,41) + String(item.quantity).padStart(7) + '\n';
  }
  k += DLINE + '\n';
  document.getElementById('preview-kot-pre').textContent = k;

  // ── CHECKLIST preview ──
  let c = '        Fire & Flavour\n';
  c += '     *** COUNTER CHECKLIST ***\n';
  c += 'Pack & Verify each item before dispatch\n';
  c += DLINE + '\n';

      items: billItems,
      customer_name:  (document.getElementById('customer-name').value || '').trim() || null,
      customer_phone: (document.getElementById('customer-phone').value || '').trim() || null,
      order_type: orderType + (orderMeta ? ' | ' + orderMeta : ''),
      delivery_address: orderType === 'Delivery' ? (document.getElementById('order-location').value === 'Other'
        ? (document.getElementById('order-location-other').value || '').trim()
        : document.getElementById('order-location').value) : null,
      subtotal, delivery_enabled: deliveryEnabled, delivery_charge: delivery,
      discount_enabled: discountEnabled, discount_type: discType, discount_value: discVal, discount_amount: discAmt,
      grand_total: grand,
      print_intent: print
    };
    if (window.reservedToken) payload.token_number = window.reservedToken;

    const res = await apiFetch('/billing', { method: 'POST', body: JSON.stringify(payload) });
    currentBillId = res.bill_id;
    window.reservedToken = null;
    document.getElementById('success-token').textContent  = '#' + res.token_number;
    document.getElementById('success-billno').textContent = res.bill_number;
    document.getElementById('success-total').textContent  = formatCurrency(grand);

    const pr = res.print_results || [];
    const statusEl = document.getElementById('print-status');
    if (!pr.length) {
      statusEl.innerHTML = `<div style="background:#FFF8DC;border:1px solid #F57F17;border-radius:8px;padding:8px 12px;font-size:12px;color:#E65100">⚠️ Auto-print not configured. Use Reprint buttons below.</div>`;
    } else {
      statusEl.innerHTML = pr.map(p => {
        if (p.queued)   return `<div style="background:#E3F2FD;border:1px solid #1565C0;border-radius:8px;padding:8px 12px;font-size:12px;color:#1565C0;margin-bottom:4px">🖨️ ${p.type.toUpperCase()}: Sent to queue — ESP32 must be ON to print</div>`;
        if (p.success)  return `<div style="background:#E8F5E9;border:1px solid #2E7D32;border-radius:8px;padding:8px 12px;font-size:12px;color:#2E7D32;margin-bottom:4px">✅ ${p.type.toUpperCase()} printed</div>`;
        if (p.skipped)  return `<div style="background:#FFF8DC;border:1px solid #F57F17;border-radius:8px;padding:8px 12px;font-size:12px;color:#E65100;margin-bottom:4px">⚠️ ${p.type.toUpperCase()}: ${p.reason || 'Printer not configured'}</div>`;
        return `<div style="background:#FFEBEE;border:1px solid #C62828;border-radius:8px;padding:8px 12px;font-size:12px;color:#C62828;margin-bottom:4px">❌ ${p.type.toUpperCase()} failed: ${p.error || 'Unknown'}</div>`;
      }).join('');
    }
    document.getElementById('success-modal').classList.add('open');
    document.getElementById('token-display').textContent = '#' + res.token_number;
    billItems = [];
    document.getElementById('customer-phone').value = '';
    document.getElementById('customer-name').value  = '';
    renderBill();
  } catch(e) { showToast(e.message, 'error'); }
  finally { btn.disabled = false; btn.innerHTML = '🖨 Save & Print'; }
}

async function saveBillOnly() { await saveBill(false); }

function closeSuccessModal() {
  document.getElementById('success-modal').classList.remove('open');
  document.getElementById('token-display').textContent = '—';
}

async function reprintDocument(type) {
  if (!currentBillId) return;
  const btn = event.target;
  btn.disabled = true; btn.textContent = '⏳…';
  try {
    const res = await apiFetch(`/billing/${currentBillId}/reprint`, { method: 'POST', body: JSON.stringify({ type }) });
    const pr = res.print_results || [];
    if (!pr.length) {
      showToast('⚠️ No printer configured in Settings', 'warning');
    } else {
      const queued  = pr.filter(p => p.queued);
      const skipped = pr.filter(p => p.skipped);
      const failed  = pr.filter(p => !p.success && !p.skipped && !p.queued);
      const ok      = pr.filter(p => p.success);
      if (queued.length)  showToast(`🖨️ ${queued.map(p=>p.type.toUpperCase()).join(' & ')}: Sent to queue`, 'success');
      if (ok.length)      showToast(`✅ ${ok.map(p=>p.type.toUpperCase()).join(' & ')} printed`, 'success');
      if (skipped.length) showToast(`⚠️ ${skipped.map(p=>p.type.toUpperCase()).join(' & ')}: No IP set`, 'warning');
      if (failed.length)  showToast(`❌ ${failed.map(p=>p.type.toUpperCase()+': '+(p.error||'error')).join(' | ')}`, 'error');
    }
  } catch (e) {
    showToast('❌ Print error: ' + e.message, 'error');
  } finally {
    const labels = { receipt: '🧾 Receipt', kot: '🍳 KOT', checklist: '✅ Checklist', both: '🖨️ All' };
    btn.disabled = false; btn.textContent = labels[type] || '🖨️ Reprint';
  }
}

let phoneTimeout = null;
let currentCustHistory = [];
function handlePhoneInput(phone) {
  clearTimeout(phoneTimeout);
  const btn = document.getElementById('cust-history-btn');
  btn.style.display = 'none';
  if (phone.length >= 10) {
    phoneTimeout = setTimeout(() => fetchCustomerData(phone), 500);
  }
}

async function fetchCustomerData(phone) {
  try {
    const data = await apiFetch(`/bills/customer/${phone}`);
    if (data.customer_name) {
      document.getElementById('customer-name').value = data.customer_name;
    }
    if (data.history && data.history.length > 0) {
      currentCustHistory = data.history;
      document.getElementById('cust-history-btn').style.display = 'block';
    }
  } catch(e) { console.error('Error fetching customer data', e); }
}

function showCustomerHistory() {
  const content = document.getElementById('cust-history-content');
  if (!currentCustHistory.length) {
    content.innerHTML = '<p>No past completed orders found.</p>';
  } else {
    content.innerHTML = `
      <table style="width:100%; font-size:13px; text-align:left; border-collapse:collapse;">
        <thead><tr style="border-bottom:1px solid #FFE0B2;"><th style="padding:6px">Date</th><th style="padding:6px">Type</th><th style="padding:6px">Amount</th></tr></thead>
        <tbody>
          ${currentCustHistory.map(h => `
            <tr style="border-bottom:1px solid #FFE0B2;">
              <td style="padding:6px">${new Date(h.created_at).toLocaleDateString()}</td>
              <td style="padding:6px">${h.order_type || 'Dine-in'}</td>
              <td style="padding:6px; font-weight:bold; color:var(--flame-light);">${formatCurrency(h.grand_total)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }
  document.getElementById('cust-history-modal').classList.add('open');
}

loadMenu();
</script>
